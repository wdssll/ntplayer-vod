name: Auto Update M3U Playlist

on:
  schedule:
    # 每天 UTC 时间 20:00 (北京时间凌晨 04:00) 自动运行一次
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collector
        run: |
          python collector.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vod.m3u vod_lite.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
